<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>En Uzun Tavşan</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #ffe6f0, #ffd6e8);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      text-align: center;
    }

    /* Arka plan katmanı */
    #bg{
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    /* Ön plan (tavşan ve yazılar) */
    h1, .sub, #rabbit{
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 28px 0 10px;
      color: #ff5fa2;
      font-size: 30px;
      letter-spacing: 0.2px;
    }

    .sub {
      margin: 0 0 18px;
      color: rgba(0,0,0,0.55);
      font-size: 14px;
    }

    #rabbit {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 120px;
    }

    /* Kulaklar */
    .ears {
      display: flex;
      gap: 18px;
      margin-top: 6px;
    }
    .ear {
      width: 40px;
      height: 86px;
      background: #ffffff;
      border: 2px solid rgba(0,0,0,0.25);
      border-radius: 22px;
      position: relative;
    }
    .ear::after {
      content: "";
      position: absolute;
      left: 9px;
      top: 12px;
      width: 18px;
      height: 58px;
      background: #ffc0da;
      border-radius: 14px;
      opacity: 0.9;
    }

    /* Kafa */
    .head {
      width: 128px;
      height: 128px;
      background: #fff;
      border: 2px solid rgba(0,0,0,0.25);
      border-radius: 50%;
      margin-top: 10px;
      position: relative;
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    }
    .eye {
      width: 12px;
      height: 12px;
      background: #111;
      border-radius: 50%;
      position: absolute;
      top: 52px;
    }
    .eye.left { left: 38px; }
    .eye.right { right: 38px; }

    .nose {
      width: 14px;
      height: 12px;
      background: #ff8fb1;
      border: 1px solid rgba(0,0,0,0.25);
      border-radius: 50% 50% 60% 60%;
      position: absolute;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
    }

    /* Gövde parçası */
    .body-part {
      width: 112px;
      height: 86px;
      background: #ffffff;
      border: 2px solid rgba(0,0,0,0.22);
      border-radius: 56px;
      margin-top: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      transition: transform 200ms ease;
    }

    /* HOP yazısı (ön plan) */
    .hop {
      margin: 12px 0 2px;
      font-size: 22px;
      font-weight: 900;
      color: #ff3f96;
      animation: hop 0.6s ease-in-out;
      letter-spacing: 1px;
      text-shadow: 0 6px 14px rgba(255,95,162,0.22);
    }

    /* Havuç (ön plan) */
    .carrot {
      margin: 8px 0 0;
      font-size: 34px;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.10));
    }

    @keyframes hop {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }

    /* Arka plan objeleri */
    .bg-item{
      position: absolute;
      opacity: 0.25;
      animation: floatUp 6s linear forwards;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.10));
      white-space: nowrap;
    }

    @keyframes floatUp{
      from{
        transform: translateY(40px);
        opacity: 0;
      }
      to{
        transform: translateY(-120vh);
        opacity: 0.25;
      }
    }
  </style>
</head>

<body>
  <div id="bg"></div>

  <h1>🐰 En Uzun Tavşan</h1>
  <p class="sub">Aşağı kaydırdıkça uzar… arada 🥕 ve HOP! çıkar 😏</p>

  <div id="rabbit">
    <div class="ears">
      <div class="ear"></div>
      <div class="ear"></div>
    </div>

    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="nose"></div>
    </div>
    <!-- Gövde parçaları buraya eklenecek -->
  </div>

  <script>
    const rabbit = document.getElementById("rabbit");
    const bg = document.getElementById("bg");

    let bodyCount = 0;

    function addHop(isBig = false) {
      const hop = document.createElement("div");
      hop.className = "hop";
      hop.textContent = "HOP!";
      if (isBig) {
        hop.style.fontSize = "34px";
      }
      rabbit.appendChild(hop);
    }

    function addCarrot() {
      const c = document.createElement("div");
      c.className = "carrot";
      c.textContent = "🥕";
      rabbit.appendChild(c);
    }

    function addBodyPart() {
      const part = document.createElement("div");
      part.className = "body-part";

      // Hafif sağ-sol kayma (bir tık arttırıldı): -9px ile +9px
      const shift = (Math.random() * 18) - 9;
      part.style.transform = `translateX(${shift}px)`;

      rabbit.appendChild(part);
    }

    function addNextPiece() {
      bodyCount++;

      // Her 9 gövdede bir havuç (ön plan)
      if (bodyCount % 9 === 0) {
        addCarrot();
        return;
      }

      // %18 ihtimalle HOP! (bazen büyük)
      if (Math.random() < 0.18) {
        addHop(Math.random() < 0.35);
        return;
      }

      // Normal gövde
      addBodyPart();
    }

    // Başlangıç
    for (let i = 0; i < 10; i++) addNextPiece();

    // Scroll ile uzama
    function onScroll() {
      const nearBottom = (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 260);
      if (nearBottom) {
        addNextPiece();
        addNextPiece();
        addNextPiece();
      }
    }
    window.addEventListener("scroll", onScroll, { passive: true });

    // Arka planda sürprizler: 🥕 ve HOP! (bazen büyük)
    function addBgItem() {
      const item = document.createElement("div");
      item.className = "bg-item";

      const isHop = Math.random() < 0.55;
      item.textContent = isHop ? "HOP!" : "🥕";

      // Bazen daha büyük
      const size = (Math.random() < 0.25)
        ? (Math.random() * 60 + 44)   // büyük
        : (Math.random() * 32 + 22);  // normal
      item.style.fontSize = size + "px";

      // Konum
      item.style.left = (Math.random() * 100) + "vw";
      item.style.top = (Math.random() * 20 + 85) + "vh";

      // HOP biraz daha belirgin olsun
      if (isHop) {
        item.style.color = "#ff3f96";
        item.style.fontWeight = "900";
        item.style.opacity = "0.22";
      } else {
        item.style.opacity = "0.20";
      }

      // Süre
      const dur = (Math.random() * 4 + 5); // 5-9 sn
      item.style.animationDuration = dur + "s";

      bg.appendChild(item);
      setTimeout(() => item.remove(), Math.round((dur + 1) * 1000));
    }

    // Arka plan sıklığı
    setInterval(() => {
      if (Math.random() < 0.45) addBgItem();
    }, 900);
  </script>
</body>
</html>
